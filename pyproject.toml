[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcpsonar"
version = "0.6.0"
description = "Uptime monitoring, rug-pull detection and anomaly detection for MCP servers"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Alessandro Fraleoni" }]
keywords = ["mcp", "model-context-protocol", "monitoring", "security", "tool-poisoning", "rug-pull", "anomaly-detection", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.28,<3",  # 2.x is a breaking rewrite (httpx2, snake_case types) — not yet supported
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiosqlite>=0.20",
    # Not used directly (mcp's OAuth client pulls it in): a floor so installs never resolve
    # to versions with known advisories (PYSEC-2026-4140..4183, found by pip-audit in CI).
    "pyjwt>=2.15",
    # Not used directly (httpx's CA bundle): GHSA-6q48-6c7w-9gw2 is fixed in 2026.10.19.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
# ruff is pinned exactly: its default rule set grows between releases, and CI must lint
# with the same rules as a contributor's machine.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "ruff==0.17.0"]

[project.scripts]
mcpsonar = "mcpsonar.cli:main"

[project.urls]
Homepage = "https://github.com/alefra93/MCPSonar"
Repository = "https://github.com/alefra93/MCPSonar"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpsonar"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60  # a hung async test should fail fast, not stall CI

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Broad `except Exception` is the design, not an accident: the check engine never raises
# (any failure becomes a "down" event), and the scheduler, webhook retries and scanner must
# survive whatever a third-party server or endpoint throws at them.
ignore = ["BLE001"]
