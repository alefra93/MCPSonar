version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    # mcp upgrades are deliberate migrations with their own ADR (docs/adr/0001-mcp-sdk-2.md),
    # never automated: a semver-major ignore does not stop Dependabot from widening the
    # requirement range (it proposed "mcp>=1.28,<3" without any code change).
    ignore:
      - dependency-name: "mcp"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
