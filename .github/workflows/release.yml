name: Release

# Push a tag like v0.5.0 (on main) to publish a GitHub Release. The tag must match the
# version in pyproject.toml, and the test suite must pass, or nothing is published.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject v$version"; exit 1; }
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "MCPSonar $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}"$'\n\n'"Pin by SHA: \`alefra93/MCPSonar@$GITHUB_SHA\`"
