name: Release

# Push a tag like v0.5.0 (on main) to publish a GitHub Release and upload to PyPI. The tag
# must match the version in pyproject.toml, and the test suite must pass, or nothing is
# published. PyPI gets the same wheel and sdist as the release, through trusted publishing
# (no stored token), from the `pypi` environment, which waits for the maintainer's approval.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag matches pyproject version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != pyproject v$version"; exit 1; }
      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Build and check the wheel and sdist
        run: |
          pip install build==1.6.1 twine==7.0.0
          python -m build
          twine check --strict dist/*
          python scripts/check_package.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \\[${GITHUB_REF_NAME#v}\\]/{f=1;next} /^## \\[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "MCPSonar $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}"$'\n\n'"Pin by SHA: \`alefra93/MCPSonar@$GITHUB_SHA\`" \
            dist/*

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mcpsonar/
    permissions:
      id-token: write  # trusted publishing: a short-lived identity, no PyPI token in the repo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
