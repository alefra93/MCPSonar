name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # stdio process handling and paths differ on Windows/macOS: one run each.
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: No invisible / bidi characters in tracked files (Trojan Source guard)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          git ls-files -z -- ':!*.png' | python -c "
          import sys, unicodedata
          bad = 0
          for f in sys.stdin.read().split(chr(0)):
              if not f: continue
              text = open(f, encoding='utf-8', errors='replace').read()
              for n, line in enumerate(text.splitlines(), 1):
                  for ch in line:
                      if unicodedata.category(ch) == 'Cf':
                          bad += 1
                          print(f'{f}:{n}: U+{ord(ch):04X} {unicodedata.name(ch, \"?\")}')
          sys.exit(1 if bad else 0)
          "

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pip-audit
      # Known-vulnerable versions of anything mcpsonar installs (PyPI advisory database).
      # A slow PyPI advisory API must not fail a build: longer socket timeout, and one retry
      # (a real finding fails both attempts, so it still blocks the build).
      - run: pip-audit --skip-editable --timeout 60 || (sleep 20 && pip-audit --skip-editable --timeout 60)

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t mcpsonar:ci .
      - name: Smoke test (non-root, healthy, setup token required)
        run: |
          docker run -d --name mcpsonar-ci -p 8675:8675 mcpsonar:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8675/api/auth/status && break; sleep 1; done
          test "$(docker exec mcpsonar-ci sh -c 'grep ^Uid /proc/1/status' | awk '{print $2}')" = "10001"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"username":"a","password":"supersecret"}' http://127.0.0.1:8675/api/auth/setup)
          test "$code" = "403"
          docker logs mcpsonar-ci 2>&1 | grep -q "setup_token="
