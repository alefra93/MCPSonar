# GitHub Pages site for MCPSonar, built by GitHub from this folder (Settings → Pages:
# branch main, folder /docs). Plugins are the ones GitHub Pages supports out of the box.
title: MCPSonar
description: >-
  Self-hosted monitor and security scanner for MCP (Model Context Protocol) servers:
  uptime, rug-pull and tool-poisoning detection, and a CI gate with SARIF reports.
url: https://alefra93.github.io
baseurl: /MCPSonar
lang: en
theme: jekyll-theme-cayman
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
github:
  repository_url: https://github.com/alefra93/MCPSonar
# banner.html is the source of the README banner image, not a page.
exclude:
  - banner.html
# Google Search Console ownership check (a public token, not a secret); jekyll-seo-tag
# renders it as <meta name="google-site-verification">.
webmaster_verifications:
  google: ZXVT4FHcDY--mj6Sevsy86k1m2L9PToHK38pa5Pk-6k
